name: Website

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'wp-org-assets/**'
      - 'bin/build-site.py'
      - '.github/workflows/pages.yml'
  # A release created by the Release workflow (GITHUB_TOKEN) does not emit a
  # "release" event to other workflows, so also rebuild when that workflow succeeds.
  workflow_run:
    workflows: [ Release ]
    types: [ completed ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Assemble the site (links to the latest published release)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bin/build-site.py --out _site --require-release

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job may publish to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
