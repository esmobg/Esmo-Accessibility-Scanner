name: Website

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'wp-org-assets/**'
      - 'bin/build-site.py'
      - '.github/workflows/pages.yml'
  # A release created by the Release workflow (GITHUB_TOKEN) does not emit a
  # "release" event to other workflows, so also rebuild when that workflow succeeds.
  workflow_run:
    workflows: [ Release ]
    types: [ completed ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Assemble the site (links to the latest published release)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bin/build-site.py --out _site --require-release

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job may publish to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
