<!doctype html>
<!--
	Source for the WordPress.org banner. Rendered by bin/screenshots/render-brand.js
	at 772x250 and 1544x500 (2x). The eye comes from bin/screenshots/brand/esmo-eye.png
	and sits on a white tile, so its navy pupil stays visible on the dark background.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Esmo Accessibility Scanner banner</title>
<style>
	html, body { margin: 0; }
	body { width: 772px; height: 250px; overflow: hidden; }
	.banner {
		position: relative;
		box-sizing: border-box;
		width: 772px;
		height: 250px;
		padding: 0 40px 0 44px;
		display: flex;
		align-items: center;
		gap: 30px;
		background:
			radial-gradient(circle at 92% 18%, rgba(143, 176, 255, 0.28), transparent 40%),
			linear-gradient(135deg, #0d1b4d 0%, #1d3fae 100%);
		color: #fff;
		font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
	}
	.banner::before {
		content: "";
		position: absolute;
		left: 0;
		top: 0;
		bottom: 0;
		width: 8px;
		background: #8fb0ff;
	}
	.icon {
		display: grid;
		place-items: center;
		box-sizing: border-box;
		width: 132px;
		height: 132px;
		flex: none;
		padding: 12px;
		border-radius: 30px;
		background: #ffffff;
		box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
	}
	.icon img { width: 100%; height: auto; }
	.text { flex: 1; min-width: 0; }
	h1 { margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.01em; }
	p { margin: 8px 0 0; font-size: 17px; color: #d3defa; }
	ul { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 0; padding: 0; list-style: none; }
	li {
		padding: 4px 9px;
		border: 1px solid rgba(201, 216, 255, 0.55);
		border-radius: 999px;
		font-size: 12px;
		font-weight: 600;
		color: #ffffff;
		background: rgba(201, 216, 255, 0.12);
	}
</style>
</head>
<body>
	<div class="banner">
		<div class="icon"><img src="brand/esmo-eye.png" alt=""></div>
		<div class="text">
			<h1>Esmo Accessibility Scanner</h1>
			<p>WCAG 2.2 AA audits with axe-core, right inside WordPress</p>
			<ul>
				<li>Full-site scans</li>
				<li>Score &amp; trends</li>
				<li>Fix guidance</li>
				<li>Auto-fixes</li>
				<li>CSV / JSON</li>
			</ul>
		</div>
	</div>
</body>
</html>
